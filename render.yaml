services:
  - type: web
    name: library-system
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        value: your-database-host
      - key: DB_USER
        value: your-database-user
      - key: DB_PASS
        value: your-database-password
      - key: DB_NAME
        value: your-database-name
      - key: DB_PORT
        value: 3306
